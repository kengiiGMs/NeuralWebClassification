<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        h1,
        h2 {
            text-align: center;
        }

        .iris {
            color: violet;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .form-body {
            display: flex;
            flex-direction: column;
            align-items: start;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 392px;
            height: 25px;
        }

        .btn {
            width: 400px;
            height: 30px;
        }

        .input-area {
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <h1>Classificador de espécies <span class="iris">Íris</span></h1>
    <h2>Insira as medidas abaixo e deixe o modelo prever a espécie</h2>
    <hr>

    <div class="container">

        <form method="POST">
            <div class="form-body">

                <div class="input-area">
                    <label for="sepal_length">Comprimento da Sépala (cm):</label>
                    <input type="text" name="sepal_length" required>
                </div>

                <div class="input-area">
                    <label for="sepal_width">Largura da Sépala (cm):</label>
                    <input type="text" name="sepal_width" required>
                </div>

                <div class="input-area">
                    <label for="petal_length">Comprimento da Pétala (cm):</label>
                    <input type="text" name="petal_length" required>
                </div>

                <div class="input-area">
                    <label for="petal_width">Largura da Pétala (cm):</label>
                    <input type="text" name="petal_width" required>
                </div>

                <input type="submit" value="Classificar" class="btn">
            </div>
        </form>

    </div>
</body>

</html>
